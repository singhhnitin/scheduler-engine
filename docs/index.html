<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scheduler Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Optimized Scheduling Engine</h1>
    <p class="subtitle">
        Appointment & Resource Allocation with Analytics
    </p>

    <section>
        <h2>Add Resource</h2>
        <input id="resId" placeholder="Resource ID">
        <input id="resFrom" type="number" placeholder="Available From">
        <input id="resTo" type="number" placeholder="Available To">
        <button onclick="addResource()">Add Resource</button>
    </section>

    <section>
        <h2>Add Appointment</h2>
        <input id="appId" placeholder="Appointment ID">
        <input id="appStart" type="number" placeholder="Start Time">
        <input id="appEnd" type="number" placeholder="End Time">
        <input id="appDuration" type="number" placeholder="Duration">
        <input id="appPriority" type="number" placeholder="Priority">
        <button onclick="addAppointment()">Add Appointment</button>
    </section>

    <section>
        <h2>Generate Optimized Schedule</h2>
        <button class="primary" onclick="generateSchedule()">Generate</button>
    </section>

    <section>
        <h2>Result</h2>
        <pre id="output">No schedule generated yet.</pre>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
