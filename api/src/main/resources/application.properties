# MongoDB (set MONGODB_URI in Render / your shell; falls back to local MongoDB)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/scheduler}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/scheduler}
spring.data.mongodb.auto-index-creation=true

# JWT (set JWT_SECRET in production; must be at least 32 characters)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
jwt.expiration-ms=3600000
