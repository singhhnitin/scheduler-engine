name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        env:
          MONGODB_URI: mongodb://localhost:27017/scheduler_test
          JWT_SECRET: ci-only-test-secret-that-is-at-least-32-chars
        run: |
          chmod +x mvnw
          ./mvnw -B verify
